<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>Login</title>
</head>
<body>
    <div class="box">
        <h2>RBAC System Login</h2>
        <form method="POST">
            {{ form.hidden_tag() }}
            <p>{{ form.username.label }}<br> {{ form.username() }}</p>
            <p>{{ form.password.label }}<br> {{ form.password() }}</p>
            <p>{{ form.submit() }}</p>
        </form>
        <small style="color: gray">Try: admin/admin123, editor/editor123, viewer/viewer123</small>
    </div>
</body>
</html>
